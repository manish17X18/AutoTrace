services:
  gateway-service:
    build:
      context: ../testbed/cluster-simulation/services
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SERVICE_NAME=gateway-service
      - DOWNSTREAM_URL=http://order-service:5001
    networks:
      - autotrace-mesh
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  order-service:
    build:
      context: ../testbed/cluster-simulation/services
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - SERVICE_NAME=order-service
      - DOWNSTREAM_URL=http://payment-vault:5003
    networks:
      - autotrace-mesh
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5001/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  reviews-service:
    build:
      context: ../testbed/cluster-simulation/services
      dockerfile: Dockerfile
    container_name: reviews-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - SERVICE_NAME=reviews-service
      - DOWNSTREAM_URL=
    networks:
      - autotrace-mesh
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5002/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  payment-vault:
    build:
      context: ../testbed/cluster-simulation/services
      dockerfile: Dockerfile
    container_name: payment-vault
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - SERVICE_NAME=payment-vault
      - DOWNSTREAM_URL=
    networks:
      - autotrace-mesh
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5003/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  autotrace-mesh:
    name: autotrace-mesh
    external: true
